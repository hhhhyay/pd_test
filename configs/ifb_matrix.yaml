remote:
  ssh_target: guobj@10.16.1.9
  docker_container: gbj_sgl_0522
  workdir: /mnt11/task/sgl
  # "auto_ip" matches the Feishu guide: host_ip=$(hostname -I | awk '{print $1}')
  host: auto_ip
  client_host: 10.16.1.9
  port: 30005

server:
  framework: sglang
  mode: ifb
  model_name: Qwen3.5-397B-A17B-Channel-FP8
  model_path: /model/qwen3.5/Qwen3.5-397B-A17B-Channel-FP8
  tokenizer_path: /model/qwen3.5/Qwen3.5-397B-A17B-Channel-FP8
  served_model_name: qwen3-397-fp8
  tp_size: 4
  pp_size: 1
  dp_size: null
  ep_size: null
  atten_cp_size: null
  quantization: null
  max_running_requests: null
  max_total_tokens: null
  mem_fraction_static: 0.80
  # From the Feishu Qwen3.5-397B-A17B-Channel-FP8 NMZ guide.
  # Set enable_radix_cache=true for cache-hit experiments. The guide notes that
  # enabling radix cache requires --mamba-scheduler-strategy extra_buffer and may
  # affect accuracy, so it is kept explicit here.
  enable_radix_cache: true
  radix_cache_extra_args:
    - --mamba-scheduler-strategy
    - extra_buffer
  env:
    NCCL_MIN_NCHANNELS: "16"
    NCCL_MAX_NCHANNELS: "16"
    SGLANG_ENABLE_SPEC_V2: "1"
    SGLANG_TORCH_PROFILER_DIR: /home/proj_qwen3.5-397b/profiling
    HSA_ENABLE_COREDUMP: "1"
    USE_DCU_CUSTOM_ALLREDUCE: "1"
    ALLREDUCE_STREAM_WITH_COMPUTE: "1"
    HIP_KERNEL_EVENT_SYSTENFENCE: "1"
    SGL_CHUNKED_PREFIX_CACHE_THRESHOLD: "0"
    GLIBC_TUNABLES: glibc.rtld.optional_static_tls=0x40000
    HIP_KERNEL_BATCH_CEILING: "100"
    GPU_FORCE_BLIT_COPY_SIZE: "16"
    HSA_KERNARG_POOL_SIZE: "8388608"
    ROC_AQL_QUEUE_SIZE: "131072"
    SGLANG_USE_LIGHTOP: "1"
    SGLANG_USE_FP8_W8A8_MOE: "1"
    SGLANG_USE_FUSED_TOPK_SOFTMAX: "1"
    SGLANG_USE_CAUSAL_CONV1D: "1"
    SGLANG_KV_LAYOUT_DCU_FA: "1"
    SGLANG_USE_AITER_LINEAR_ATTN: "1"
  extra_args:
    - --numa-node
    - "0"
    - "0"
    - "0"
    - "0"
    - "1"
    - "1"
    - "1"
    - "1"
    - --trust-remote-code
    - --dtype
    - bfloat16
    - --attention-backend
    - fa3
    - --page-size
    - "64"
    - --watchdog-timeout
    - "36000"
    - --kv-cache-dtype
    - fp8_e4m3
    - --enable-piecewise-cuda-graph
    - --speculative-algorithm
    - EAGLE
    - --speculative-num-steps
    - "3"
    - --speculative-eagle-topk
    - "1"
    - --speculative-num-draft-tokens
    - "4"
    - --chunked-prefill-size
    - "-1"
    - --skip-server-warmup
    - --cuda-graph-max-bs
    - "64"

benchmark:
  # sglang-oai uses the OpenAI-compatible /v1/completions endpoint.
  backend: sglang-oai
  num_prompts: 256
  warmup_requests: 30
  request_rate: inf
  ready_timeout_s: 1800
  cooldown_s: 5
  dataset_name: generated-shared-prefix
  tokenize_prompt: false
  gsp_fast_prepare: false
  clear_gsp_cache: true
  random_range_ratio: 1.0
  concurrency_scan:
    start: 1
    end: 128
    rules:
      - until: 32
        step: 1
      - until: 64
        step: 2
      - until: 128
        step: 4
  input_output_pairs:
    - input_len: 2048
      output_len: 1024
    - input_len: 65536
      output_len: 1024
    - input_len: 32768
      output_len: 128
  radix_cache_hit_rates:
    - 0.50
    - 0.90
    - 0.99
  sla:
    mean_ttft_s_lt: 10
    mean_tpot_ms_lt: 75
  stop_after_first_sla_failure: false

reports:
  local_dir: reports/ifb_sglang_qwen3_397_fp8_nmz
  remote_dir: /mnt11/task/sgl/pd_test_runs/ifb_sglang_qwen3_397_fp8_nmz
